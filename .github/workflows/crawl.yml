name: 주간 데이터 수집

on:
  schedule:
    # 금요일 오후 6시(KST) = 금요일 09:00 UTC → type_a 5시간 작업
    - cron: "0 9 * * 5"
    # 토요일 새벽 3시(KST) = 금요일 18:00 UTC → type_b 5시간 작업
    - cron: "0 18 * * 5"
  workflow_dispatch:
    inputs:
      collect_mode:
        description: "수집 범위 (수동 실행 시에만 선택 가능. 예약 실행은 자동으로 결정됨)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - type_a
          - type_b
      apsl_amt_end:
        description: "상한 값 (원 단위, 예: 500000000 = 5억)"
        required: false
        default: "500000000"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5시간

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 브라우저 설치
        uses: browser-actions/setup-chrome@v1

      - name: 수집 범위 결정
        id: mode
        run: |
          # 수동 실행(workflow_dispatch)이면 사람이 고른 값을 그대로 쓴다.
          # 예약 실행(schedule)이면 어느 cron이 트리거했는지로 자동 결정한다:
          #   금요일 09:00 UTC(=한국시간 금 18시) 트리거 -> type_a
          #   금요일 18:00 UTC(=한국시간 토 새벽 3시) 트리거 -> type_b
          if [ -n "${{ github.event.inputs.collect_mode }}" ]; then
            echo "mode=${{ github.event.inputs.collect_mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * 5" ]; then
            echo "mode=type_a" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 18 * * 5" ]; then
            echo "mode=type_b" >> "$GITHUB_OUTPUT"
          else
            echo "mode=both" >> "$GITHUB_OUTPUT"
          fi

      - name: 실행
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          SITE_LOGIN_ID: ${{ secrets.SITE_LOGIN_ID }}
          SITE_LOGIN_PW: ${{ secrets.SITE_LOGIN_PW }}
          TYPE_A_LABEL: ${{ secrets.TYPE_A_LABEL }}
          TYPE_B_LABEL: ${{ secrets.TYPE_B_LABEL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHARE_EMAIL: ${{ secrets.SHARE_EMAIL }}
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON_ADMIN }}
          COLLECT_MODE: ${{ steps.mode.outputs.mode }}
          APSL_AMT_END: ${{ github.event.inputs.apsl_amt_end || '500000000' }}
        run: python crawler.py

      - name: 결과 파일을 실행 기록에 첨부 (백업용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-backup-${{ steps.mode.outputs.mode }}
          path: /tmp/*_data*.xlsx
          if-no-files-found: ignore
          retention-days: 14
